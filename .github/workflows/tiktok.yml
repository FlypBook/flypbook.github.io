# Posts FlypBook stories to TikTok as videos, a few times a day (pipeline/post_tiktok.py).
# Does nothing until the TikTok keys are added (see TIKTOK_SETUP.md).
name: Post to TikTok

on:
  schedule:
    - cron: "5 1,11,14,16,19,22 * * *"   # six posts a day: about 7 AM, 10 AM, noon, 3 PM, 6 PM, 9 PM US Eastern
  workflow_dispatch:               # "Run workflow" button for a test post
  push:
    paths: [".github/workflows/tiktok.yml"]   # editing this file runs it once (a quick check)

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null

      - name: Make and post a video
        working-directory: pipeline
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}       # empty = private (SELF_ONLY) until TikTok approves the app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python post_tiktok.py
