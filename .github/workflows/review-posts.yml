# FlypBook: Scroll Like Shakespeare
# Checks stories that readers post in the app and publishes the safe ones. Free for public repos.
# When nobody has posted, a run finishes in a few seconds.
name: Review posted stories

on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 minutes
  workflow_dispatch:

concurrency:
  group: review-posts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-narration.txt
      # Only install the AI voice when someone has actually posted (most runs finish in seconds).
      - name: Any posts waiting?
        id: queue
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          n=$(python -c "from run_batch import supabase; print(len(supabase('GET','story_submissions','select=id&status=in.(pending,processing)&limit=50') or []))")
          echo "waiting=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.queue.outputs.waiting != '0'
        with:
          path: ~/.cache/huggingface
          key: kokoro-model-v1
      - name: Install the AI voice (Kokoro)
        if: steps.queue.outputs.waiting != '0'
        run: |
          sudo apt-get install -y -qq espeak-ng > /dev/null
          pip install --quiet -r pipeline/requirements-narration.txt
      - name: Review and publish posts
        if: steps.queue.outputs.waiting != '0'
        working-directory: pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python review_posts.py
