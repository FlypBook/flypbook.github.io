<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlypBook · TikTok connected</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; --bg: #fbf8f2; --ink: #18151b; --soft: #6b6370; --line: #e3dacb; --grape: #5b2fb3; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141117; --ink: #f3eff7; --soft: #a59cae; --line: #2c2633; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 440px; width: 100%; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: var(--soft); margin: 0 0 16px; }
    code { display: block; padding: 14px; border: 1px solid var(--line); border-radius: 10px; word-break: break-all; font-size: 0.95rem; color: var(--ink); }
    button { margin-top: 12px; padding: 12px 18px; border: 0; border-radius: 10px; background: var(--grape); color: #fff; font-weight: 700; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="head">Almost done</h1>
    <p id="msg">Copy this code and paste it into the window where you ran <b>post_tiktok.py login</b>.</p>
    <code id="code">No code found.</code>
    <button id="copy" type="button">Copy code</button>
  </main>
  <script>
    // TikTok sends people back here after they approve FlypBook's auto-poster. This page only shows the code;
    // it never sends it anywhere.
    const q = new URLSearchParams(location.search);
    const code = q.get("code"), err = q.get("error_description") || q.get("error");
    if (code) document.getElementById("code").textContent = code;
    if (err) {
      document.getElementById("head").textContent = "TikTok didn't connect";
      document.getElementById("msg").textContent = err;
    }
    document.getElementById("copy").onclick = async () => {
      try { await navigator.clipboard.writeText(code || ""); document.getElementById("copy").textContent = "Copied"; } catch {}
    };
  </script>
</body>
</html>
